<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // La copia vieja publicada en GitHub Pages no está conectada a la base
      // de datos real: se manda al dominio oficial, conservando la pantalla
      // (#/...). Con ?local=1 se puede seguir abriendo esa copia, por si
      // alguien necesita exportar datos que guardó ahí en modo local.
      if (location.hostname.endsWith('github.io') && !/[?&]local=1(&|$)/.test(location.search)) {
        location.replace('https://metodobrujula.ar/' + location.hash)
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brújula" />
    <meta
      name="description"
      content="Método Brújula — Plataforma profesional de Orientación Vocacional para psicólogos, psicopedagogos y orientadores. Ordená el proceso, los recursos y el informe de cada consultante en un solo lugar."
    />
    <title>Método Brújula · Encontrá tu norte</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Método Brújula" />
    <meta property="og:title" content="Método Brújula — Encontrá tu norte, construí tu camino" />
    <meta
      property="og:description"
      content="La plataforma para profesionales de Orientación Vocacional: registro sesión a sesión, actividades para el consultante en su celular e informes que recogen todo el recorrido."
    />
    <meta property="og:image" content="https://metodobrujula.ar/social-preview.png" />
    <meta property="og:url" content="https://metodobrujula.ar/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Método Brújula — Encontrá tu norte, construí tu camino" />
    <meta
      name="twitter:description"
      content="La plataforma para profesionales de Orientación Vocacional: registro sesión a sesión, actividades para el consultante en su celular e informes que recogen todo el recorrido."
    />
    <meta name="twitter:image" content="https://metodobrujula.ar/social-preview.png" />
    <script>
      // Aplica el tema antes del primer paint para evitar flash.
      try {
        var t = JSON.parse(localStorage.getItem('mb:ui') || '{}')
        var theme = (t.state && t.state.theme) || 'light'
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
